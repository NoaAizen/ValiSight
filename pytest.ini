# Collection is scoped to tests/ deliberately. board/ carries the on-target
# stage-1 radar code brought over from the other branches, and its test drives
# a compiled C binary that is not built in this checkout -- collecting it
# aborts the entire run before a single test executes, which reads as "the
# suite is broken" rather than "one directory is not ours to run".
[pytest]
testpaths = tests
