% radar_people.cfg -- IWR1843BOOST, mmWave SDK 3.x OOB demo, 10 fps.
% Mode P of SCAN-MODES-PLAN.md: PEOPLE, 2-15 m. The operational mode.
%
% RUN ON THIS BOARD 2026-08-16. Every line accepted, no Error, sensorStart Done
% -- the 768 KB radar cube loads, so the 48-loop fallback below is not needed.
% radar/chirp.py derives the figures, tools/tests/test_chirp.py asserts the same
% code reproduces the three that were measured off radar_10hz.cfg, and then the
% board was asked directly, over 600 stage-1 frames and 400 recorded ones:
%
%                        derived    MEASURED
%   range resolution     0.0703 m   0.0702 m  grid fit over 1701 points, mean
%                                             residual 0.0044 m; the old
%                                             0.0436 m grid gives 0.0114
%   Doppler step         0.1559     0.1557    spacing of the reported values
%   max unambiguous vel  +-4.99 m/s    --     needs a fast target to confirm
%   max unambiguous rng  17.99 m    8.79 m seen -- the room, not the limit
%   HPF blind zone       0.604 m    0.62 m    nearest point reported
%   active / period      12.29 / 100 ms
%   link                    --      PASS: 600 frames, 0 bad gaps, 0 bytes lost,
%                                   10.00 fps, frames 192-320 B
%   interframe margin       --      84.50-84.56 ms, i.e. 15.5% of the frame
%                                   period consumed. Mode C ran at 24.5%: the
%                                   shorter chirp train more than pays for the
%                                   4x deeper Doppler FFT, so the deeper
%                                   velocity axis costs NOTHING in headroom
%   die temperature         --      36-38 C
%
% STILL UNMEASURED, and each needs something in front of the radar: the exit
% gate (a walker at 12 m, detected in >=90% of frames, v != 0, no aliasing
% markers), and the range-bias/phase re-calibration flagged further down.
%
% WHY THIS CONFIG EXISTS AT ALL. Under radar_10hz.cfg v_max is 0.649 m/s, so a
% person walking at 1.2-1.4 m/s folds to |v| <= 0.10 and reads as static: 76-99.8%
% of the points in all 13 recorded sessions sit at exactly zero Doppler. Two
% things die with it. The obvious one is the ~9.6 deg azimuth error the demo's
% TDM-MIMO angle stage makes at k != 0. The one that matters more here is that
% Doppler SPREAD WITHIN A CLUSTER -- limbs moving faster than the torso -- is
% the single most discriminative feature separating a person from a fan, a
% curtain, or a rigid body, and it is what PERCEPTION-PLAN's radar channel is
% built on. This config is a prerequisite for that channel, not a tuning pass.
%
% The whole fix is idleTime 429 -> 7 us plus a gentler slope for range. No
% firmware, no C, no DPU. SCAN-MODES-PLAN section 4 rank 0.
sensorStop
flushCfg
dfeDataOutputMode 1
channelCfg 15 7 0
adcCfg 2 1
adcbufCfg -1 0 1 1 1
% profileCfg id fStart idle adcStart rampEnd txPow txPhase slope txStart nAdc rate hpf1 hpf2 rxGain
% idleTime 7 us is the change that buys v_max; slope 43.4 MHz/us is what pays
% for it. Range resolution goes 4.36 -> 7.03 cm, which is irrelevant for a
% human target that spans 40-60 cm, and R_max goes 11.16 -> 18.0 m, which the
% 15 m envelope needs. rampEndTime 57 keeps the excursion inside the 4 GHz
% band (43.4 x 57 = 2473.8 MHz, comfortably under).
profileCfg 0 77 7 7 57 0 0 43.4 1 256 5209 0 0 30
chirpCfg 0 0 0 0 0 0 0 1
chirpCfg 1 1 0 0 0 0 0 4
chirpCfg 2 2 0 0 0 0 0 2
% 64 loops -> 64 Doppler bins -> v_res 0.156 m/s, which separates a slow walker
% from clutter. It also puts the radar cube at 768 KB against a 1 MB L3 that the
% demo does not entirely own. IF THE CLI REJECTS THIS PROFILE, the first thing
% to try is 48 loops (v_res 0.208 m/s, 576 KB) -- and a silently rejected cube
% looks like a config that loaded, so check for the Error line, do not assume.
frameCfg 0 2 64 0 100 1 0
lowPower 0 0
% Same reasoning as radar_10hz.cfg: TLV 1+7 for the SNR join, stats on because
% they are how the radar reports its own overruns, range profile off because
% 512 B/frame that nothing reads is 512 B/frame that can be dropped instead.
guiMonitor -1 1 0 0 0 0 1
cfarCfg -1 0 2 8 4 3 0 15 1
cfarCfg -1 1 0 4 2 3 1 15 1
multiObjBeamForming -1 1 0.5
% clutterRemoval STAYS OFF, and for a different reason than in radar_10hz.cfg.
% There the static target was a calibration reflector. Here it is a PERSON
% STANDING STILL, which is a detection this rig must not lose -- and turning
% this on deletes it. The cost is that furniture keeps returning points; that
% is handled downstream by the static background map (PERCEPTION-PLAN 2a),
% where it is reversible, rather than in the radar, where it is not.
clutterRemoval -1 0
calibDcRangeSig -1 0 -5 8 256
extendedMaxVelocity -1 0
lvdsStreamCfg -1 0 0 0
% ############ UNVERIFIED FOR THIS PROFILE ############
% Carried over from radar_10hz.cfg, where it was measured on 2026-08-10 against
% a 14 cm TCR at 1.5 m boresight. The rangeBias term should survive the profile
% change -- it is a fixed RF/antenna delay expressed in metres, and c*tau/2 does
% not care about the slope. THE PER-CHANNEL PHASE TABLE IS NOT SO LUCKY: it was
% fitted over a 3.44 GHz sampled band and this profile sweeps 2.13 GHz, so the
% phases are being applied at frequencies they were not measured at.
%
% Consequence if it is wrong: a boresight shift, which is exactly what
% T_camera_radar.json's (R,t) absorbed last time -- see the warning on the same
% line in radar_10hz.cfg. Re-run radar_people_measure_bias.cfg against the TCR
% BEFORE trusting any projection from this profile, and before recording
% anything that will be used as training data.
% 2026-08-18: phase table RE-MEASURED on THIS profile (43.4 MHz/us). TCR on tripod, 1.50 m boresight,
%   vertex at antenna height, az 0.0 / el +1.5 deg, SNR 47 dB. 297/300 frames in-mode, bias jitter 0.2 mm,
%   comp spread p90-p10 <= 0.033. Magnitudes taper 0.47-1.0 (near-field of the 14 cm TCR at 1.5 m; the
%   2.5 m runs were SNR-starved and unstable). Relative phases agree with the validated 08-10 table.
%   rangeBias is bin-quantised by the firmware (0.07 m): 0.061 @1.5 m vs 0.122 @2.5 m -> verify against tape at stations.
%   Evidence: ~/ValiSight_noa/calib_2026-08-18/phase_table_run{1..6}*.json
% previous (measured 08-10 on the 70 MHz/us profile, NOT valid here):
% compRangeBiasAndRxChanPhase 0.0827654 0.97766 0.21017 0.85803 0.24323 0.58871 0.66953 0.67664 0.58447 0.78122 0.28757 0.69891 0.35345 0.40619 0.61334 0.51917 0.63443 0.81543 0.47922 0.66461 0.50806 0.37115 0.78207 0.54428 0.79688
compRangeBiasAndRxChanPhase 0.0610061 0.61029 -0.11346 0.55341 0.02545 0.45618 0.20755 0.45044 0.14233 0.79236 -0.00369 0.67084 0.14050 0.48602 0.36154 0.48508 0.26669 0.99963 -0.02731 0.83493 0.13831 0.59302 0.41367 0.57050 0.29404
measureRangeBiasAndRxChanPhase 0 1.5 0.2
CQRxSatMonitor 0 3 5 121 0
CQSigImgMonitor 0 127 4
analogMonitor 0 0
aoaFovCfg -1 -60 60 -30 30
% Range gate: floor raised 0.35 -> 0.60 to follow the HPF corner, which moved
% with the slope. Ceiling 16 m sits just past the 15 m envelope and inside
% R_max 18.0, so a target beyond the envelope is gated out rather than folded
% back in as a phantom at a plausible range.
cfarFovCfg -1 0 0.60 16.0
% Doppler gate wider than v_max, i.e. no gate. Under radar_10hz.cfg the -1..1
% here was also no gate; at +-4.99 m/s it would have clipped a walker.
cfarFovCfg -1 1 -5.0 5.0
calibData 0 0 0
sensorStart
